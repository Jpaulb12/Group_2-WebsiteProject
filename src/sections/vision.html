<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 300vh; 
            background-color: white;
        }

        .animation-container {
            position: relative;
            top: 85%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 100%;
            max-width: 3024px;
            height: 100vh;
            max-height: 900px;
            background-color: #ffffff;
                      
        }

        .shape {
            position: absolute;
            transition: transform 0.1s ease-out;
            will-change: transform;
            max-height: 90% ;
        
        }
         

        #text-layer {
            margin-top: 40%;
        }

        #shape-yellow {
            min-width: 3cm;
            min-height: 5cm;
        }

        /* --- 1. Mobile Styles (Up to 767px) --- */
        @media (max-width: 767px) {
            header {
                height: auto !important;
                padding: 1rem !important;
            }
            header h1 {
                font-size: 1.5rem !important;
            }
            header nav {
                font-size: 0.875rem !important;
                line-height: 1.25rem !important;
            }

            #text-layer {
                margin-top: 0% !important;
                font-size: 150% !important;
                line-height: 2rem !important;
                max-width: 65% !important;
                padding: 0 2rem;
                margin-bottom: 50%; /* Reduced to prevent extreme layout push */
            }

            .animation-container {
                top: 60% !important;
                height: 100vh !important;
            }

            .animation-container > div {
                transform: scale(0.9);
            }

            #pink {
                right: 15% !important;
                left: auto !important;
                top: 10% !important;
                width: 40%;
                height: 70%;
            }

            #shape-yellow {
                position: absolute !important;
                top: 10% !important;
                left: 0px !important;
                height: 90%;
                width: 70%;
            }

            #shape-teal {
                top: 16% !important;
                width: 55% !important;
                left: 10% !important;
            }

            #shape-blue {
                left: 45% !important;
                top: 18% !important;
                width: 55% !important;
            }

            #shape-red {
                left: 15% !important;
                top: 30% !important;
                width: 73%;
                height: 50%;
            }

            #secgreen {
                margin-top: -55%; /* Fixed extreme clipping */
                height: auto;
                width: 40%;
                left: 62%;
            }
        }

        /* --- 2. Standard iPad / Tablet Styles (768px to 1024px) --- */
        @media (min-width: 768px) and (max-width: 1024px) {
            #text-layer {
                margin-top: 10% !important;
                font-size: 2.5rem !important;
            }
            .animation-container {
                top: 65% !important;
            }
            #shape-blue {
                left: 40% !important;
                top: 15% !important;
                width: 45% !important;
            }
            #pink {
                left: 35% !important;
                width: 45% !important;
            }
        }

        /* --- 3. iPad Pro / Laptop Styles (1025px to 1668px) --- */
        @media (min-width: 1025px) and (max-width: 1668px) {
            #shape-blue {
                left: 43% !important;
                top: 21% !important;
                width: 55% !important;
                height: 20%;
            }
            #pink {
                margin-left: 29% !important;
                top: 10% !important;
                width: 60%;
                height: 95%;
            }
            
        }
        @media (min-width: 1024px) and (max-width: 1024px){
             #pink {
                margin-left: 20% !important;
                top: 3% !important;
                width: 60%;
                height: 95%;
            }
             #shape-teal {
                top: 16% !important;
                width: 45% !important;
                height:40%;
                left: 10% !important;
            }
            #shape-red {
                left: 15% !important;
                top: 55% !important;
                width: 63%;
                height: 30%;
            }
              #secgreen {
                margin-top: -18%; /* Fixed extreme clipping */
                height: auto;
                width: 40%;
                left: 61%;
            }
            #text-layer{
                display: none;
            }
        }
    </style>
</head>
<body id="wrapper-bg-view">

    

    <div class="relative w-full h-screen">
        <div class="absolute z-[999] h-screen inset-0 flex justify-center items-center font-semibold text-white pointer-events-none">
            <h1 id="text-layer" class="text-center text-4xl max-w-auto md:w-[30%] leading-10 pointer-events-auto">
                We help you set focus and gain impact. By adding to the conversation, not to the noise. 
            </h1>
        </div>

        <div class="animation-container">
            <div id="pink" class="shape absolute top-[15%]   left-[15%] w-auto" >
                <img src="images/Vector.png" alt="pink-images">
            </div>

            <div id="shape-yellow" class="shape z-8">
                <img src="images/yellow.png" alt="yellow">
            </div>

            <div id="shape-teal" class="shape absolute top-[22%] left-[19%] w-[55%] z-10">
                <img src="images/stgreen.png" alt="teal-shape">
            </div>

            <div id="shape-red" class="shape absolute top-[70%] left-[10%] z-8">
                <img src="images/sfa.png" alt="red-image">
            </div>

            <div id="shape-blue" class="shape absolute top-[15%] left-[45%] w-[37%] z-10">
                <img src="images/Blue.png" alt="blue-image-icon">
            </div>

            <div id="secgreen" class="shape absolute top-[50%] right-0">
                <img src="images/secgreen.png" alt="secondary-green"> 
            </div>
        </div>
    </div>

    <script>
        const yellow = document.getElementById('shape-yellow');
        const teal = document.getElementById('shape-teal');
        const text = document.getElementById('text-layer');
        const red = document.getElementById('shape-red');
        const blue = document.getElementById('shape-blue');

        window.addEventListener('scroll', () => {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            if (maxScroll <= 0) return;
            
            const scrollPercent = window.scrollY / maxScroll;
            const progress = Math.min(scrollPercent * 2, 1);

            yellow.style.transform = `translate(${progress * 50}px, ${progress * 250}px)`;
            teal.style.transform = `translate(${progress * -80}px, ${progress * 412}px)`;
            red.style.transform = `translate(${progress * -30}px, ${progress * 250}px)`;
            blue.style.transform = `translate(${progress * -70}px, ${progress * 250}px)`;
            text.style.transform = `translateY(${(progress + 1) * 50}px)`;
        });
    </script>
</body>
</html>
